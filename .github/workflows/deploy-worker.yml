name: Deploy Registry Worker

on:
  push:
    branches: [main, master]
    paths:
      - "registry-worker/**"
      - "wrangler.toml"
      - "registry/index.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-worker-deployment
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: registry-worker/package-lock.json
      - name: Install Worker dependencies
        working-directory: registry-worker
        run: npm ci
      - name: Type-check Worker
        working-directory: registry-worker
        run: npx tsc --noEmit
      - name: Deploy Worker to registry.lplusplus.bond
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare secrets are not configured; validation passed, deployment skipped."
            exit 0
          fi
          npx wrangler deploy
